name: ms2-plans-and-recipes-catalog

services:
  db:
    image: postgres:16-alpine
    container_name: ms2-plans-and-recipes-catalog-db
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: dev-only
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "5433:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-only -d catalog"]
      interval: 1s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # NOTE: RabbitMQ is intentionally NOT declared here.
  # The broker is provided project-level by the container `nur-tricenter-rabbitmq`
  # (image rabbitmq:3-management-alpine) attached to the `nur-tricenter-net` network, and it is
  # published on the host at AMQP 5672 / management 15672 with guest/guest
  # on vhost "/". Declaring a second broker here would collide with that published port.
  #
  # Host port 5672 is a hard requirement, not a default:
  # Joseco.Communication.External.RabbitMQ 1.1.0 builds its ConnectionFactory from
  # HostName/UserName/Password only and silently ignores RabbitMqSettings.Port and UseSsl, so any
  # other host port makes the publisher and consumer talk to the wrong broker with no error.

  # ---------------------------------------------------------------------------
  # Schema is applied by a ONE-SHOT step, not by the API on boot.
  #
  #   docker compose run --rm webapi-migrate
  #
  # or let `up` do it, which is what the service_completed_successfully dependency
  # below does. Inside the image that is literally:
  #
  #   ENTRYPOINT ["dotnet", "Catalog.App.dll"]  command: ["--migrate"]
  #
  # so the command being run is `dotnet Catalog.App.dll --migrate`. It builds the
  # host (which registers both DbContexts), applies pending migrations to the WRITE
  # side (DomainDbContext) and then to the READ side (StoredDbContext), and exits 0 on
  # success or 1 on failure. The API service below has `Migrations__ApplyOnStartup`
  # UNSET, i.e. false, so it never races this job for the schema. It also never seeds:
  # Seed__Enabled is not set here.
  #
  # Both histories apply cleanly on an empty database: the write side owns the
  # `write` schema, the read side owns `read`, and the outbox stays in `outbox`
  # (pinned by Joseco.Outbox.EFCore). Verified against postgres:16-alpine; a
  # re-run is a no-op. `docker compose up` therefore gets all the way through.
  # Both migration histories start from zero, so a `catalog-db-data` volume left
  # over from the older single-schema model has to be recreated with
  # `docker compose down -v`.
  # ---------------------------------------------------------------------------
  webapi-migrate:
    # The image is BUILT from this working tree, not pulled.
    #
    # It used to be `image: robertperezlino/...:latest` from Docker Hub, which meant
    # whatever somebody pushed last is what you ran — nothing tied the running container to
    # the code you had just edited. `build` makes the image a function of this tree.
    #
    # `context` is the repository ROOT, not src/Catalog.App: the Dockerfile has to COPY
    # Directory.Packages.props and NuGet.config, which live at the root, and Docker cannot
    # copy from outside the build context. `dockerfile` is therefore the path from the
    # context root to the file.
    #
    # The private feed needs credentials, and they arrive as build secrets rather than
    # ARG/ENV so no token is baked into an image layer. Supply them when building:
    #
    #   $env:NUGET_USERNAME = "..."
    #   $env:NUGET_TOKEN    = "..."
    #   docker compose build
    build:
      context: .
      dockerfile: src/Catalog.App/Dockerfile
    container_name: ms2-plans-and-recipes-catalog-migrate
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CatalogDbConnectionString: Host=db;Port=5432;Database=catalog;Username=dev-only;Password=dev-only-password
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  webapi:
    # Same build as webapi-migrate: one source, one Dockerfile. Compose builds it once and
    # both services share the resulting image layer.
    build:
      context: .
      dockerfile: src/Catalog.App/Dockerfile
    container_name: ms2-plans-and-recipes-catalog-api
    ports:
      - "8082:8080"
    environment:
      # NOT Development. Nothing in Startup reads the environment name to decide
      # behaviour any more — every switch below is explicit configuration, so this
      # value only shows up in the startup log line.
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CatalogDbConnectionString: Host=db;Port=5432;Database=catalog;Username=dev-only;Password=dev-only-password
      # ONE database for both sides. The write/read split is by schema: `write` for the
      # aggregates, `read` for the projections, `outbox` for the transactional outbox.
      # Schema: applied by webapi-migrate, not here.
      Migrations__ApplyOnStartup: "false"
      # Sample catalogue data (30 foods / 25 recipes / 2 plans). Off in this stack on
      # purpose; set it to "true" if you want the demo data in this database.
      Seed__Enabled: "false"
      # Swagger stays OFF here. The healthcheck below probes /health, so this stack no longer
      # needs the OpenAPI document served. Turning Swagger on here was only ever there to give
      # the healthcheck something to hit, and it published an endpoint nobody in this stack uses.
      Swagger__Enabled: "false"
      # TLS terminates at whatever fronts this container; plain HTTP is what arrives.
      HttpsRedirection__Enabled: "false"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      webapi-migrate:
        # The API must not serve traffic against a schema that does not exist.
        condition: service_completed_successfully
    healthcheck:
      # /health, NOT the OpenAPI document. Consul registers this service against /health, so a
      # healthcheck that probes anything else is measuring a different contract than the one the
      # gateway and the orchestrator depend on.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  workerservice:
    # The outbox drain. Built from its own Dockerfile because it is a separate publishable
    # artifact: two hosts, two assemblies, two images. Sharing the API's image would mean
    # shipping MVC and Swagger into a process that serves no HTTP.
    build:
      context: .
      dockerfile: src/Catalog.WorkerService/Dockerfile
    container_name: ms2-plans-and-recipes-catalog-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__CatalogDbConnectionString: Host=db;Port=5432;Database=catalog;Username=dev-only;Password=dev-only-password
      # RabbitMQ is deliberately NOT declared in this file. A second broker would collide
      # with the platform's on host port 5672, and Joseco.Communication.External.RabbitMQ 1.1.0
      # builds its ConnectionFactory from HostName/UserName/Password only, silently ignoring
      # Port — so a broker on any other host port would make publish and consume talk to
      # different endpoints with no error at all. Host 5672 is a hard requirement.
      #
      # That means this stack's worker starts but cannot publish: there is nothing on
      # localhost:5672 unless the platform's broker is up. The outbox rows stay
      # `processed = false`, which is correct and observable rather than a silent failure.
      RabbitMqSettings__Host: "localhost"
      RabbitMqSettings__UserName: "guest"
      RabbitMqSettings__Password: "guest"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      webapi-migrate:
        # The drain must not run against a schema that does not exist.
        condition: service_completed_successfully
    healthcheck:
      # No port to probe: this host serves no HTTP. Reading the kernel's own view of the
      # process needs no extra tool, and the runtime image ships no procps, so pgrep would
      # fail forever while the worker is running perfectly.
      test: ["CMD-SHELL", "grep -qs 'Catalog.WorkerService' /proc/*/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  catalog-db-data:

networks:
  backend:
