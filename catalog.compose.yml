# =============================================================================
#  Catalog — platform variant.
#
#  This file declares the catalog's two business processes attached to the
#  SHARED platform infrastructure: the same `nur-tricenter-net` network, the same
#  Postgres, the same RabbitMQ, the same Consul.
#
#  The catalog repository also owns `docker-compose.yml`, a standalone stack with
#  its own Postgres and its own network for running the catalog alone. Two files,
#  one pair of services, answering two different questions:
#
#    docker-compose.yml    "does the catalog work on its own?"       -> yes
#    catalog.compose.yml   "does the catalog work in the platform?"   -> yes
#
#  CONTAINER NAMES match what the platform stack already runs, because that is
#  what is actually up on the machine right now; renaming them would orphan every
#  running container. The standalone catalog uses `ms2-plans-and-recipes-catalog-*`
#  prefixes, so the two variants never collide.
#
#  NOT DECLARED HERE, deliberately: Postgres, RabbitMQ and Consul. They belong to
#  the orchestrator's docker-compose.infra.yml, which brings them up. Declaring
#  them again would mean two brokers competing for host port 5672, a hard
#  requirement rather than a preference: Joseco.Communication.External.RabbitMQ 1.1.0
#  builds its ConnectionFactory from HostName/UserName/Password only and silently
#  ignores Port, so a broker on any other port makes publish and consume talk to
#  different endpoints with no error at all.
#
#  This file is not started on its own. It is a fragment the orchestrator's compose
#  includes; running it directly fails because db/consul/rabbitmq are undefined
#  here by design. Start the platform, and the catalog comes with it:
#
#     cd ../nur-tricenter-orchestrator/compose && docker compose up -d
# =============================================================================

services:
  catalog-api:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: nur-tricenter-catalog-api
    hostname: catalog-api
    working_dir: /app
    command: ["dotnet", "Catalog.App.dll"]
    volumes:
      - ./src/Catalog.App/bin/Debug/net8.0:/app:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Connect to the platform Postgres, but the catalog's own database,
      # not the default `postgres` one. Created by the init.sql that
      # mounts at /docker-entrypoint-initdb.d inside the postgres container.
      ConnectionStrings__CatalogDbConnectionString: "Host=nur-tricenter-postgres;Port=5432;Database=ms2-plans-and-recipes-catalog;Username=dev-only;Password=dev-only-password"
      RabbitMqSettings__Host: "nur-tricenter-rabbitmq"
      RabbitMqSettings__UserName: "guest"
      RabbitMqSettings__Password: "guest"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
      # Seed the sample catalogue (30 foods / 25 recipes / 2 plans) on startup so the seed
      # events land in the transactional outbox, are drained by the catalog worker, and reach
      # the broker's fanout exchanges (meal-plan-published, food-published, recipe-published,
      # recipe-updated, food-nutritional-info-updated). The topology that fans those out to
      # ms1/ms3/ms4/ms5 is declared by rabbitmq-definitions.json at broker boot.
      Seed__Enabled: "true"
      ServiceRegistration__ServiceDiscoveryAddress: "http://nur-tricenter-consul:8500"
      # Pin the host and port the catalog advertises to Consul. Without
      # these the catalog's IServerPortResolver picks whatever Kestrel
      # bound to, which during hosted-service startup is usually a dynamic
      # port and makes the registration inconsistent with the gateway's
      # expectations.
      ServiceRegistration__Host: "catalog-api"
      ServiceRegistration__Port: "8080"
      ServiceRegistration__ServiceName: "catalog"
      # This is local-dev compose: the catalog's own appsettings.Development.template.json
      # sets Migrations__ApplyOnStartup=true exactly for this case. The default in
      # appsettings.json is false because "a web process is a mediocre place to run DDL",
      # but here the catalog-api container IS the local dev environment, so letting it
      # migrate on boot removes the need to hand-run the migration before docker compose up.
      Migrations__ApplyOnStartup: "true"
    networks: [nur-tricenter-net]
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started
    healthcheck:
      # A shell TCP probe, not curl. The aspnet runtime image ships no curl, so a healthcheck that
      # calls it fails with "curl: not found" forever and the container is reported unhealthy
      # while the application is perfectly fine. /dev/tcp is part of bash, which is present.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  catalog-workerservice:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: nur-tricenter-catalog-workerservice
    hostname: catalog-workerservice
    working_dir: /app
    command: ["dotnet", "Catalog.WorkerService.dll"]
    volumes:
      - ./src/Catalog.WorkerService/bin/Debug/net8.0:/app:ro
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__CatalogDbConnectionString: "Host=nur-tricenter-postgres;Port=5432;Database=ms2-plans-and-recipes-catalog;Username=dev-only;Password=dev-only-password"
      RabbitMqSettings__Host: "nur-tricenter-rabbitmq"
      RabbitMqSettings__UserName: "guest"
      RabbitMqSettings__Password: "guest"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
    networks: [nur-tricenter-net]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        # service_healthy, not service_started: the outbox processor connects to the broker as
        # soon as it starts, and a broker that is still booting turns the first publish attempt
        # into an exception on every poll until it settles.
        condition: service_healthy
    # This process is NOT registered in Consul, and that is deliberate.
    #
    # Consul registration exists so the gateway can route traffic to a service. The worker
    # publishes to RabbitMQ and serves no HTTP at all: it has no listener, no controller and no
    # address to register. Registering it would publish a route to an endpoint that cannot
    # answer, and the gateway would happily proxy into a black hole.
    #
    # Its liveness is a container concern, not a routing concern, so it belongs in a Docker
    # healthcheck. The process is a long-running OutboxProcessor: if it exits, the outbox stops
    # being drained and no event is ever projected. That is exactly what a restart policy is for.
    healthcheck:
      # `/proc/<pid>/cmdline` rather than `pgrep`: the aspnet runtime image ships no procps, so
      # `pgrep: not found` fails the check forever while the worker is running perfectly. Reading
      # the kernel's own view of the process needs no extra tool. There is no port to probe
      # either — this host has no listener.
      test: ["CMD-SHELL", "grep -qs 'Catalog.WorkerService' /proc/*/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  nur-tricenter-net:
    # The platform network, owned by the orchestrator's infra compose. The catalog attaches to it
    # and resolves Postgres, RabbitMQ and Consul by container name.
    external: true